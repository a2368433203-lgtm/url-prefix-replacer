<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>网址转换器（外部 ⇄ 内部）</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%);
    color: #1f2937;
  }
  .card {
    width: 100%;
    max-width: 720px;
    background: #ffffff;
    border-radius: 16px;
    padding: 28px 28px 24px;
    box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .subtitle {
    margin: 0 0 18px;
    font-size: 13px;
    color: #64748b;
  }

  /* 方向切换区域 */
  .direction-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
    background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
    border: 1px solid #c7d2fe;
    border-radius: 12px;
  }
  .direction-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 500;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .badge-external {
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #fde68a;
  }
  .badge-internal {
    background: #dbeafe;
    color: #1e40af;
    border: 1px solid #bfdbfe;
  }
  .arrow-big {
    color: #6366f1;
    font-size: 18px;
    font-weight: bold;
  }
  .btn-switch {
    appearance: none;
    border: none;
    cursor: pointer;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    background: #4f46e5;
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
    transition: transform .05s ease, background .15s ease;
    font-family: inherit;
    white-space: nowrap;
  }
  .btn-switch:hover { background: #4338ca; }
  .btn-switch:active { transform: translateY(1px); }

  /* 规则展示 */
  .rule {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: center;
    padding: 10px 12px;
    margin-bottom: 16px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    font-size: 12px;
    color: #475569;
  }
  .rule code {
    background: #eef2ff;
    color: #3730a3;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    word-break: break-all;
  }
  .arrow { color: #94a3b8; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: #475569;
    margin-bottom: 6px;
  }
  textarea {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.6;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #0f172a;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
    word-break: break-all;
  }
  textarea:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
  }
  .status {
    font-size: 12px;
    color: #64748b;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #94a3b8;
    display: inline-block;
  }
  .status.ok .dot { background: #10b981; }
  .status.warn .dot { background: #f59e0b; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    appearance: none;
    border: none;
    cursor: pointer;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 500;
    border-radius: 10px;
    transition: transform .05s ease, box-shadow .15s ease, background .15s ease, opacity .15s ease;
    font-family: inherit;
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { cursor: not-allowed; opacity: .5; }
  .btn-primary {
    background: #4f46e5;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
  }
  .btn-primary:hover:not(:disabled) { background: #4338ca; }
  .btn-ghost {
    background: #f1f5f9;
    color: #334155;
    border: 1px solid #e2e8f0;
  }
  .btn-ghost:hover:not(:disabled) { background: #e2e8f0; }
  .output-wrap { margin-top: 18px; }
  .output {
    width: 100%;
    min-height: 72px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.6;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #0f172a;
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 10px;
    word-break: break-all;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .output.empty { color: #94a3b8; font-style: italic; }
  .hint {
    margin-top: 14px;
    padding: 10px 12px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    color: #92400e;
    border-radius: 10px;
    font-size: 12px;
    line-height: 1.55;
    display: none;
  }
  .hint.show { display: block; }
  .footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid #e2e8f0;
    font-size: 11px;
    color: #94a3b8;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  kbd {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    color: #334155;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>网址转换器</h1>
    <p class="subtitle">在"外部"和"内部"网址之间互相转换，路径与查询参数原样保留。</p>

    <!-- 方向切换 -->
    <div class="direction-bar">
      <div class="direction-label">
        <span class="badge badge-external" id="badgeFrom">外部</span>
        <span class="arrow-big">→</span>
        <span class="badge badge-internal" id="badgeTo">内部</span>
      </div>
      <button id="switchBtn" class="btn-switch" type="button">切换方向</button>
    </div>

    <!-- 规则展示 -->
    <div class="rule">
      <span>当前规则</span>
      <code id="ruleFrom">https://www.skyvendorise.com</code>
      <span class="arrow">→</span>
      <code id="ruleTo">https://label.alibaba-inc.com</code>
    </div>

    <!-- 输入 -->
    <label for="input" id="inputLabel">粘贴外部网址</label>
    <textarea id="input" spellcheck="false" placeholder="https://www.skyvendorise.com/corpora/labeling/sdk?subTaskId=68233815&missionType=sample&taskId=51972&projectId=5508"></textarea>

    <div class="row">
      <span id="status" class="status"><span class="dot"></span><span id="statusText">等待输入</span></span>
      <div class="actions">
        <button id="copyBtn" class="btn-ghost" type="button" disabled>复制结果</button>
        <button id="openBtn" class="btn-primary" type="button" disabled>打开转换后的网址</button>
      </div>
    </div>

    <div class="hint" id="hint"></div>

    <!-- 输出 -->
    <div class="output-wrap">
      <label for="output" id="outputLabel" style="margin-bottom:6px;">转换后是内部网址</label>
      <div id="output" class="output empty">尚未生成</div>
    </div>

    <div class="footer">
      <span>快捷键：<kbd>⌘</kbd>+<kbd>V</kbd> 粘贴 · <kbd>⌘</kbd>+<kbd>↩</kbd> 回车也可以触发转换</span>
      <span id="matchInfo">未匹配</span>
    </div>
  </main>

<script>
(function () {
  // 两个方向的配置
  var DIRECTIONS = [
    {
      name: '外部 → 内部',
      fromLabel: '外部',
      toLabel: '内部',
      source: 'https://www.skyvendorise.com',
      target: 'https://label.alibaba-inc.com',
      inputLabel: '粘贴外部网址',
      outputLabel: '转换后是内部网址',
      placeholder: 'https://www.skyvendorise.com/corpora/labeling/sdk?subTaskId=68233815&missionType=sample&taskId=51972&projectId=5508'
    },
    {
      name: '内部 → 外部',
      fromLabel: '内部',
      toLabel: '外部',
      source: 'https://label.alibaba-inc.com',
      target: 'https://www.skyvendorise.com',
      inputLabel: '粘贴内部网址',
      outputLabel: '转换后是外部网址',
      placeholder: 'https://label.alibaba-inc.com/corpora/labeling/sdk?subTaskId=68233815&missionType=sample&taskId=51972&projectId=5508'
    }
  ];

  var currentDirIndex = 0; // 0 = 外部→内部, 1 = 内部→外部

  // DOM 元素
  var input = document.getElementById('input');
  var output = document.getElementById('output');
  var openBtn = document.getElementById('openBtn');
  var copyBtn = document.getElementById('copyBtn');
  var switchBtn = document.getElementById('switchBtn');
  var status = document.getElementById('status');
  var statusText = document.getElementById('statusText');
  var hint = document.getElementById('hint');
  var matchInfo = document.getElementById('matchInfo');
  var badgeFrom = document.getElementById('badgeFrom');
  var badgeTo = document.getElementById('badgeTo');
  var ruleFrom = document.getElementById('ruleFrom');
  var ruleTo = document.getElementById('ruleTo');
  var inputLabel = document.getElementById('inputLabel');
  var outputLabel = document.getElementById('outputLabel');

  var currentResult = '';

  function getDir() {
    return DIRECTIONS[currentDirIndex];
  }

  function normalizeSlashes(s) {
    var m = s.match(/^([a-zA-Z][a-zA-Z0-9+.\-]*:\/\/)(\/*)([\s\S]*)$/);
    if (!m) return s;
    return m[1] + m[3].replace(/^\/+/, '');
  }

  function startsWithSource(url, source) {
    if (!url) return false;
    var lower = url.toLowerCase();
    var srcLower = source.toLowerCase();
    if (lower === srcLower) return true;
    if (lower === srcLower + '/') return true;
    return lower.indexOf(srcLower + '/') === 0;
  }

  function compute(url) {
    var dir = getDir();
    if (!startsWithSource(url, dir.source)) {
      return { matched: false, value: url };
    }
    var cut = dir.source.length;
    if (url.charAt(cut) === '/') cut += 1;
    var rest = url.slice(cut);
    var value = normalizeSlashes(dir.target + '/' + rest.replace(/^\/+/, ''));
    return { matched: true, value: value };
  }

  function setStatus(kind, text) {
    status.className = 'status' + (kind === 'ok' ? ' ok' : kind === 'warn' ? ' warn' : '');
    statusText.textContent = text;
  }

  function showHint(text) {
    if (!text) {
      hint.classList.remove('show');
      hint.textContent = '';
      return;
    }
    hint.textContent = text;
    hint.classList.add('show');
  }

  function refreshButtons() {
    var hasResult = !!currentResult;
    openBtn.disabled = !hasResult;
    copyBtn.disabled = !hasResult;
  }

  // 更新界面上的方向相关元素
  function updateDirectionUI() {
    var dir = getDir();
    badgeFrom.textContent = dir.fromLabel;
    badgeTo.textContent = dir.toLabel;
    ruleFrom.textContent = dir.source;
    ruleTo.textContent = dir.target;
    inputLabel.textContent = dir.inputLabel;
    outputLabel.textContent = dir.outputLabel;
    input.placeholder = dir.placeholder;
    // 切换 badge 颜色类
    badgeFrom.className = 'badge ' + (dir.fromLabel === '外部' ? 'badge-external' : 'badge-internal');
    badgeTo.className = 'badge ' + (dir.toLabel === '内部' ? 'badge-internal' : 'badge-external');
  }

  function render(rawUrl) {
    var url = (rawUrl || '').trim();
    var dir = getDir();
    currentResult = '';

    if (!url) {
      output.textContent = '尚未生成';
      output.classList.add('empty');
      matchInfo.textContent = '未匹配';
      setStatus('idle', '等待输入');
      showHint('');
      refreshButtons();
      return;
    }

    var r = compute(url);
    if (!r.matched) {
      output.textContent = url;
      output.classList.remove('empty');
      matchInfo.textContent = '未匹配' + dir.fromLabel + '前缀，已原样保留';
      setStatus('warn', '未匹配到规则');
      showHint('输入的网址不是以 ' + dir.source + ' 开头（不是' + dir.fromLabel + '网址），已按原样保留。你可以直接点"打开转换后的网址"访问原始地址。');
      currentResult = url;
      refreshButtons();
      return;
    }

    currentResult = r.value;
    output.textContent = r.value;
    output.classList.remove('empty');
    matchInfo.textContent = '已匹配：' + dir.fromLabel + ' → ' + dir.toLabel;
    setStatus('ok', '转换成功');
    showHint('');
    refreshButtons();
  }

  // 切换方向
  switchBtn.addEventListener('click', function () {
    currentDirIndex = (currentDirIndex + 1) % DIRECTIONS.length;
    updateDirectionUI();
    // 重新计算当前输入
    render(input.value);
  });

  input.addEventListener('input', function () { render(input.value); });
  input.addEventListener('paste', function () {
    setTimeout(function () { render(input.value); }, 0);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      render(input.value);
    }
  });

  openBtn.addEventListener('click', function () {
    if (!currentResult) return;
    var w = window.open(currentResult, '_blank', 'noopener,noreferrer');
    if (!w) {
      showHint('浏览器拦截了新窗口。已把结果复制到剪贴板，请手动粘贴到地址栏打开。');
      copyToClipboard(currentResult);
    }
  });

  copyBtn.addEventListener('click', function () {
    if (!currentResult) return;
    copyToClipboard(currentResult).then(function (ok) {
      showHint(ok ? '已复制到剪贴板' : '复制失败，请手动选择文本复制');
      setTimeout(function () { showHint(''); }, 1600);
    });
  });

  function copyToClipboard(text) {
    return new Promise(function (resolve) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(fallbackCopy(text)); });
      } else {
        resolve(fallbackCopy(text));
      }
    });
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  // 初始化
  updateDirectionUI();
  render(input.value);
})();
</script>
</body>
</html>
