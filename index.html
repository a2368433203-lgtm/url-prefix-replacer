<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>URL 前缀替换器</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%);
    color: #1f2937;
  }
  .card {
    width: 100%;
    max-width: 720px;
    background: #ffffff;
    border-radius: 16px;
    padding: 28px 28px 24px;
    box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .subtitle {
    margin: 0 0 20px;
    font-size: 13px;
    color: #64748b;
  }
  .rule {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: center;
    padding: 10px 12px;
    margin-bottom: 16px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    font-size: 12px;
    color: #475569;
  }
  .rule code {
    background: #eef2ff;
    color: #3730a3;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    word-break: break-all;
  }
  .arrow { color: #94a3b8; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: #475569;
    margin-bottom: 6px;
  }
  textarea {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.6;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #0f172a;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
    word-break: break-all;
  }
  textarea:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
  }
  .status {
    font-size: 12px;
    color: #64748b;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #94a3b8;
    display: inline-block;
  }
  .status.ok .dot { background: #10b981; }
  .status.warn .dot { background: #f59e0b; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    appearance: none;
    border: none;
    cursor: pointer;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 500;
    border-radius: 10px;
    transition: transform .05s ease, box-shadow .15s ease, background .15s ease, opacity .15s ease;
    font-family: inherit;
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { cursor: not-allowed; opacity: .5; }
  .btn-primary {
    background: #4f46e5;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
  }
  .btn-primary:hover:not(:disabled) { background: #4338ca; }
  .btn-ghost {
    background: #f1f5f9;
    color: #334155;
    border: 1px solid #e2e8f0;
  }
  .btn-ghost:hover:not(:disabled) { background: #e2e8f0; }
  .output-wrap { margin-top: 18px; }
  .output {
    width: 100%;
    min-height: 72px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.6;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #0f172a;
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 10px;
    word-break: break-all;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .output.empty { color: #94a3b8; font-style: italic; }
  .hint {
    margin-top: 14px;
    padding: 10px 12px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    color: #92400e;
    border-radius: 10px;
    font-size: 12px;
    line-height: 1.55;
    display: none;
  }
  .hint.show { display: block; }
  .footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid #e2e8f0;
    font-size: 11px;
    color: #94a3b8;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  kbd {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    color: #334155;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>URL 前缀替换器</h1>
    <p class="subtitle">把 URL 中的源域名前缀替换成目标域名前缀，路径与查询参数原样保留。</p>

    <div class="rule">
      <span>规则</span>
      <code id="ruleFrom">https://www.skyvendorise.com</code>
      <span class="arrow">→</span>
      <code id="ruleTo">https://label.alibaba-inc.com</code>
      <span style="margin-left:auto;font-size:11px;color:#94a3b8;">域名匹配不区分大小写 · 自动规范化斜杠</span>
    </div>

    <label for="input">粘贴原 URL</label>
    <textarea id="input" spellcheck="false" placeholder="https://www.skyvendorise.com/corpora/labeling/sdk?subTaskId=68233815&missionType=sample&taskId=51972&projectId=5508"></textarea>

    <div class="row">
      <span id="status" class="status"><span class="dot"></span><span id="statusText">等待输入</span></span>
      <div class="actions">
        <button id="copyBtn" class="btn-ghost" type="button" disabled>复制结果</button>
        <button id="openBtn" class="btn-primary" type="button" disabled>打开替换后的 URL</button>
      </div>
    </div>

    <div class="hint" id="hint"></div>

    <div class="output-wrap">
      <label for="output" style="margin-bottom:6px;">替换后</label>
      <div id="output" class="output empty">尚未生成</div>
    </div>

    <div class="footer">
      <span>快捷键：<kbd>⌘</kbd>+<kbd>V</kbd> 粘贴 · <kbd>⌘</kbd>+<kbd>↩</kbd> 回车也可以触发替换</span>
      <span id="matchInfo">未匹配</span>
    </div>
  </main>

<script>
(function () {
  var SOURCE = 'https://www.skyvendorise.com';
  var TARGET = 'https://label.alibaba-inc.com';

  var input = document.getElementById('input');
  var output = document.getElementById('output');
  var openBtn = document.getElementById('openBtn');
  var copyBtn = document.getElementById('copyBtn');
  var status = document.getElementById('status');
  var statusText = document.getElementById('statusText');
  var hint = document.getElementById('hint');
  var matchInfo = document.getElementById('matchInfo');

  var currentResult = '';
  var currentStatus = 'idle'; // idle | ok | warn

  function normalizeSlashes(s) {
    // 去掉协议后紧跟的所有多余斜杠，避免拼接时出现 //
    var m = s.match(/^([a-zA-Z][a-zA-Z0-9+.\-]*:\/\/)(\/*)([\s\S]*)$/);
    if (!m) return s;
    return m[1] + m[3].replace(/^\/+/, '');
  }

  function startsWithSource(url) {
    if (!url) return false;
    var lower = url.toLowerCase();
    var srcLower = SOURCE.toLowerCase();
    // 允许源前缀末尾可选带 /
    if (lower === srcLower) return true;
    if (lower === srcLower + '/') return true;
    return lower.indexOf(srcLower + '/') === 0;
  }

  function compute(url) {
    if (!startsWithSource(url)) {
      return { matched: false, value: url };
    }
    // 找到源前缀的实际结束位置（保留用户输入的大小写）
    var cut = SOURCE.length;
    if (url.charAt(cut) === '/') cut += 1;
    var rest = url.slice(cut);
    var value = normalizeSlashes(TARGET + '/' + rest.replace(/^\/+/, ''));
    return { matched: true, value: value };
  }

  function setStatus(kind, text) {
    currentStatus = kind;
    status.className = 'status' + (kind === 'ok' ? ' ok' : kind === 'warn' ? ' warn' : '');
    statusText.textContent = text;
  }

  function showHint(text) {
    if (!text) {
      hint.classList.remove('show');
      hint.textContent = '';
      return;
    }
    hint.textContent = text;
    hint.classList.add('show');
  }

  function refreshButtons() {
    var hasResult = !!currentResult;
    openBtn.disabled = !hasResult;
    copyBtn.disabled = !hasResult;
  }

  function render(rawUrl) {
    var url = (rawUrl || '').trim();
    currentResult = '';

    if (!url) {
      output.textContent = '尚未生成';
      output.classList.add('empty');
      matchInfo.textContent = '未匹配';
      setStatus('idle', '等待输入');
      showHint('');
      refreshButtons();
      return;
    }

    var r = compute(url);
    if (!r.matched) {
      output.textContent = url;
      output.classList.remove('empty');
      matchInfo.textContent = '未匹配源前缀，已原样保留';
      setStatus('warn', '未匹配到规则');
      showHint('输入的 URL 不是以 ' + SOURCE + ' 开头，已按原样保留。你可以直接点"打开替换后的 URL"访问原始地址。');
      currentResult = url; // 允许用户直接打开原 URL
      refreshButtons();
      return;
    }

    currentResult = r.value;
    output.textContent = r.value;
    output.classList.remove('empty');
    matchInfo.textContent = '已匹配并替换前缀';
    setStatus('ok', '替换成功');
    showHint('');
    refreshButtons();
  }

  input.addEventListener('input', function () { render(input.value); });
  input.addEventListener('paste', function () {
    // 部分浏览器 paste 事件早于 input，稍后再渲染一次以保险
    setTimeout(function () { render(input.value); }, 0);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      render(input.value);
    }
  });

  openBtn.addEventListener('click', function () {
    if (!currentResult) return;
    var w = window.open(currentResult, '_blank', 'noopener,noreferrer');
    if (!w) {
      showHint('浏览器拦截了新窗口。已把结果复制到剪贴板，请手动粘贴到地址栏打开。');
      copyToClipboard(currentResult);
    }
  });

  copyBtn.addEventListener('click', function () {
    if (!currentResult) return;
    copyToClipboard(currentResult).then(function (ok) {
      showHint(ok ? '已复制到剪贴板' : '复制失败，请手动选择文本复制');
      setTimeout(function () { showHint(''); }, 1600);
    });
  });

  function copyToClipboard(text) {
    return new Promise(function (resolve) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(fallbackCopy(text)); });
      } else {
        resolve(fallbackCopy(text));
      }
    });
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  // 初始渲染
  render(input.value);
})();
</script>
</body>
</html>
